# Configuración de Spark
spark.master                     spark://spark-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               /opt/spark/logs
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled       true
spark.sql.adaptive.coalescePartitions.enabled true

# Configuración de memoria
spark.driver.memory              1g
spark.driver.maxResultSize       1g
spark.executor.memory            1g

# Configuración de red
spark.driver.host                spark-master
spark.driver.bindAddress         0.0.0.0
spark.driver.port                7078

# Configuración de directorios de trabajo
spark.local.dir                  /opt/spark/tmp
spark.worker.dir                 /opt/spark/work

# UI Configuration
spark.ui.port                    4040

# Configuración adicional para Docker
spark.sql.execution.arrow.pyspark.enabled    false
spark.kubernetes.container.image.pullPolicy  Never