version: '3.8'
services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: es01
    networks:
      - elastic
    ports:
      - "9200:9200"
    mem_limit: 2g
  kib01:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kib01
    networks:
      - elastic
    ports:
      - "5601:5601"

networks:
  elastic:
    driver: bridge